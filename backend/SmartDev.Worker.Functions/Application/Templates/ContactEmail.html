<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>New Contact Message</title>
    </head>
    <body style="margin: 0; padding: 0; background: #f4f7fb; color: #162033; font-family: Arial, Helvetica, sans-serif">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background: #f4f7fb; margin: 0; padding: 32px 16px">
            <tr>
                <td align="center">
                    <table
                        role="presentation"
                        width="100%"
                        cellpadding="0"
                        cellspacing="0"
                        style="max-width: 640px; background: #ffffff; border: 1px solid #dce4ef; border-radius: 8px; overflow: hidden"
                    >
                        <tr>
                            <td style="background: #10233f; color: #ffffff; padding: 24px 28px">
                                <div style="font-size: 13px; line-height: 18px; color: #b8c7da; text-transform: uppercase; letter-spacing: 0.04em">
                                    SmartDev contact form
                                </div>
                                <h1 style="font-size: 24px; line-height: 32px; margin: 8px 0 0 0; font-weight: 700">New contact message received</h1>
                            </td>
                        </tr>
                        <tr>
                            <td style="padding: 28px">
                                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse: collapse">
                                    <tr>
                                        <td style="padding: 0 0 16px 0">
                                            <div
                                                style="
                                                    font-size: 12px;
                                                    line-height: 18px;
                                                    color: #5c6b80;
                                                    text-transform: uppercase;
                                                    letter-spacing: 0.04em;
                                                "
                                            >
                                                From
                                            </div>
                                            <div style="font-size: 18px; line-height: 26px; color: #162033; font-weight: 700">{{SenderName}}</div>
                                            <a
                                                href="mailto:{{SenderEmail}}"
                                                style="font-size: 14px; line-height: 22px; color: #1d64d8; text-decoration: none"
                                                >{{SenderEmail}}</a
                                            >
                                        </td>
                                    </tr>
                                </table>

                                <div
                                    style="
                                        font-size: 12px;
                                        line-height: 18px;
                                        color: #5c6b80;
                                        text-transform: uppercase;
                                        letter-spacing: 0.04em;
                                        margin-top: 8px;
                                    "
                                >
                                    Message
                                </div>
                                <div
                                    style="
                                        font-size: 15px;
                                        line-height: 24px;
                                        color: #162033;
                                        margin-top: 8px;
                                        padding: 18px;
                                        background: #f8fafc;
                                        border: 1px solid #e3eaf3;
                                        border-radius: 6px;
                                    "
                                >
                                    {{Message}}
                                </div>

                                <table
                                    role="presentation"
                                    width="100%"
                                    cellpadding="0"
                                    cellspacing="0"
                                    style="border-collapse: collapse; margin-top: 24px"
                                >
                                    <tr>
                                        <td style="padding: 14px 0; border-top: 1px solid #e3eaf3">
                                            <div
                                                style="
                                                    font-size: 12px;
                                                    line-height: 18px;
                                                    color: #5c6b80;
                                                    text-transform: uppercase;
                                                    letter-spacing: 0.04em;
                                                "
                                            >
                                                Contact Message Id
                                            </div>
                                            <div style="font-size: 14px; line-height: 22px; color: #162033; word-break: break-all">
                                                {{ContactMessageId}}
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 14px 0 0 0; border-top: 1px solid #e3eaf3">
                                            <div
                                                style="
                                                    font-size: 12px;
                                                    line-height: 18px;
                                                    color: #5c6b80;
                                                    text-transform: uppercase;
                                                    letter-spacing: 0.04em;
                                                "
                                            >
                                                Occurred At
                                            </div>
                                            <div style="font-size: 14px; line-height: 22px; color: #162033">{{OccurredAt}}</div>
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
