<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="author" content="Franco Diaz" />
        <meta name="description" content="Personal project case study for Franco Diaz Licham." />
        <title>Personal Project</title>
        <link rel="canonical" href="https://smartdev.com.au" />
        <link rel="icon" href="../public/favicon.ico" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    </head>
    <body>
        <header class="bg-body-tertiary">
            <nav class="navbar navbar-expand-lg container-xxxl">
                <a class="navbar-brand" href="/">
                    <img src="/images/logo.png" class="d-inline-block align-top ms-4 logo" alt="" />
                </a>
                <button class="navbar-toggler me-4" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-4">
                        <li class="nav-item"><a class="nav-link" href="/#hero">HOME</a></li>
                        <li class="nav-item"><a class="nav-link" href="/#about-me">ABOUT ME</a></li>
                        <li class="nav-item"><a class="nav-link" href="/#services">EXPERIENCE</a></li>
                        <li class="nav-item"><a class="nav-link" href="/#portfolio">PORTFOLIO</a></li>
                        <li class="nav-item"><a class="nav-link" href="/#contact-me">CONTACT</a></li>
                    </ul>
                </div>
            </nav>
        </header>
        <main>
            <!-- hero -->
            <section id="portfolio-hero">
                <div class="container-xxl hero-container">
                    <div class="portfolio-text">
                        <h1 id="projectName" class="mb-5"></h1>
                        <h5 id="subtitle"></h5>
                    </div>
                </div>
            </section>

            <!-- project -->
            <section id="project" class="container-xxl">
                <h1 class="pb-4">The Project</h1>
                <div class="work-summary">
                    <div class="work-logo">
                        <img id="projectLogo" alt="" />
                    </div>
                    <div class="work-copy">
                        <p id="overview"></p>
                    </div>
                </div>
            </section>

            <!-- demo -->
            <section id="projectDemo" class="container-xxl" hidden>
                <div class="demo-video">
                    <iframe
                        id="projectDemoFrame"
                        title="Project demo video"
                        src=""
                        referrerpolicy="strict-origin-when-cross-origin"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        allowfullscreen
                    ></iframe>
                </div>
            </section>

            <!-- impact -->
            <section class="benefits">
                <div id="benefits" class="container-xxl">
                    <h1 class="mb-4">Impact</h1>
                    <ul id="impact"></ul>
                </div>
            </section>

            <!-- tech -->
            <section id="snapshot" class="container-xxl">
                <h1 class="mb-4">Tech</h1>
                <div class="snapshot-grid">
                    <div>
                        <h5>Backend</h5>
                        <p id="backendTech"></p>
                    </div>
                    <div>
                        <h5>Frontend</h5>
                        <p id="frontendTech"></p>
                    </div>
                    <div>
                        <h5>CI/CD & Cloud</h5>
                        <p id="cicdCloudTech"></p>
                    </div>
                    <div>
                        <h5>Architecture</h5>
                        <p id="architectureTech"></p>
                    </div>
                </div>
            </section>
        </main>
        <!-- footer -->
        <footer>
            <div class="container-xxl d-flex flex-wrap justify-content-between align-items-center p-0">
                <div class="col-md-4 d-flex align-items-center">
                    <span class="ms-3" id="copyrightYear"></span>
                </div>
                <ul class="nav col-md-4 justify-content-end d-flex">
                    <li class="ms-3">
                        <a href="https://au.linkedin.com/in/franco-diaz-licham"><i class="bi bi-linkedin icons"></i></a>
                    </li>
                    <li class="ms-3">
                        <a href="https://github.com/Franco-Diaz-Licham"><i class="bi bi-github icons"></i></a>
                    </li>
                </ul>
            </div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <script type="module" src="/src/personal-project.ts"></script>
    </body>
</html>
