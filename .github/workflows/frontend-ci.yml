name: Frontend CI

on:
  workflow_dispatch:

env:
  BUILD_DIR: frontend
  NODE_VERSION: 22.x
  VITE_API_BASE_URL: ${{ secrets.API_BASE_URL }}
  VITE_ENTRA_CLIENT_ID: ${{ secrets.ENTRA_CLIENT_ID }}
  VITE_ENTRA_AUTHORITY: ${{ secrets.ENTRA_AUTHORITY }}
  VITE_ENTRA_API_SCOPE: ${{ secrets.ENTRA_API_SCOPE }}
  VITE_PRIMEREACT_LICENSE_KEY: ${{ secrets.PRIMEREACT_LICENSE_KEY }}

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.BUILD_DIR }}/package-lock.json

      - name: Install frontend dependencies
        working-directory: ${{ env.BUILD_DIR }}
        run: npm ci --include=optional

      - name: Run frontend tests
        working-directory: ${{ env.BUILD_DIR }}
        run: npm run test

      - name: Build frontend
        working-directory: ${{ env.BUILD_DIR }}
        run: npm run build
