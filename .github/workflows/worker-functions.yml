name: Worker Functions

on:
  workflow_dispatch:

env:
  DOTNET_VERSION: 10.0.x
  PROJECT_PATH: backend/SmartDev.Worker.Functions/SmartDev.Worker.Functions.csproj
  WORKER_FUNCTION_APP_NAME: ${{ secrets.WORKER_FUNCTION_APP_NAME }}
  WORKER_FUNCTION_RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
  AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

jobs:
  build-and-deploy:
    name: Build and Deploy Worker Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh

    steps:
      # Checkout the repository so the .NET solution and Function App project can be restored and published.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the .NET SDK version used by the Azure Functions projects.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Restore dependencies explicitly so package failures are visible before publish.
      - name: Restore Worker Functions
        run: dotnet restore $env:PROJECT_PATH

      # Publish the Worker Functions app into a clean deployment artifact folder.
      - name: Publish Worker Functions
        run: |
          $publishPath = Join-Path $env:RUNNER_TEMP "worker-functions-publish"

          if (Test-Path $publishPath) {
            Remove-Item $publishPath -Recurse -Force
          }

          dotnet publish $env:PROJECT_PATH `
            --configuration Release `
            --output $publishPath `
            --no-restore

      # Log in with the repository service principal so the workflow can deploy the Function App.
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      # Deploy the published Worker Functions folder using the Azure Functions action so Flex Consumption uses One Deploy.
      - name: Deploy Worker Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.WORKER_FUNCTION_APP_NAME }}
          package: ${{ runner.temp }}/worker-functions-publish
          sku: flexconsumption
          remote-build: false

      # List the functions Azure indexed after deployment.
      - name: List Worker Functions
        run: |
          az functionapp function list `
            --resource-group $env:WORKER_FUNCTION_RESOURCE_GROUP `
            --name $env:WORKER_FUNCTION_APP_NAME `
            --output table
