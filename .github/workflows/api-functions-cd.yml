name: API Functions CD

on:
  workflow_dispatch:

env:
  DOTNET_VERSION: 10.0.x
  PROJECT_PATH: backend/SmartDev.Api.Functions/SmartDev.Api.Functions.csproj
  API_FUNCTION_APP_NAME: ${{ secrets.API_FUNCTION_APP_NAME }}
  API_FUNCTION_RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
  AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

jobs:
  deploy:
    name: Deploy API Functions
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore API Functions
        run: dotnet restore $env:PROJECT_PATH

      - name: Publish API Functions
        run: |
          $publishPath = Join-Path $env:RUNNER_TEMP "api-functions-publish"

          if (Test-Path $publishPath) {
            Remove-Item $publishPath -Recurse -Force
          }

          dotnet publish $env:PROJECT_PATH `
            --configuration Release `
            --output $publishPath `
            --no-restore

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      - name: Deploy API Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.API_FUNCTION_APP_NAME }}
          package: ${{ runner.temp }}/api-functions-publish
          sku: flexconsumption
          remote-build: false

      - name: List API Functions
        run: |
          az functionapp function list `
            --resource-group $env:API_FUNCTION_RESOURCE_GROUP `
            --name $env:API_FUNCTION_APP_NAME `
            --output table
