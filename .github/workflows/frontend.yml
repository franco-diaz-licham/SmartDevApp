name: Frontend

on:
  workflow_dispatch:

env:
  BUILD_DIR: frontend
  OUTPUT_DIR: dist
  NODE_VERSION: 22.x
  SWA_NAME: ${{ secrets.SWA_NAME }}
  SWA_RESOURCE_GROUP: ${{ secrets.SWA_RESOURCE_GROUP }}
  AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
  VITE_API_BASE_URL: ${{ secrets.API_BASE_URL }}
  VITE_ENTRA_CLIENT_ID: ${{ secrets.ENTRA_CLIENT_ID }}
  VITE_ENTRA_AUTHORITY: ${{ secrets.ENTRA_AUTHORITY }}
  VITE_ENTRA_API_SCOPE: ${{ secrets.ENTRA_API_SCOPE }}
  VITE_PRIMEREACT_LICENSE_KEY: ${{ secrets.PRIMEREACT_LICENSE_KEY }}

jobs:
  build-and-deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: pwsh

    steps:
      # Checkout the repository so the React application and package-lock.json are available to the workflow.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the Node.js version used to build the frontend and enable npm dependency caching.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.BUILD_DIR }}/package-lock.json

      # Restore the exact dependency versions recorded in package-lock.json, including Rollup's Linux optional packages.
      - name: Install frontend dependencies
        working-directory: ${{ env.BUILD_DIR }}
        run: npm ci --include=optional

      # Run the frontend test suite before producing the deployable artifact.
      - name: Run frontend tests
        working-directory: ${{ env.BUILD_DIR }}
        run: npm run test

      # Build the production Vite application into frontend/dist.
      # Vite reads the VITE_* environment variables above and embeds them into the generated browser bundle.
      - name: Build frontend
        working-directory: ${{ env.BUILD_DIR }}
        run: npm run build

      # Log in with the repository service principal so the workflow can retrieve the Static Web Apps deployment token.
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      # Deploy the pre-built frontend/dist artifact to the production Azure Static Web Apps environment.
      - name: Deploy frontend
        run: |
          $artifactPath = Join-Path `
            $env:GITHUB_WORKSPACE `
            "$env:BUILD_DIR/$env:OUTPUT_DIR"

          $deploymentToken = az staticwebapp secrets list `
            --name $env:SWA_NAME `
            --resource-group $env:SWA_RESOURCE_GROUP `
            --query "properties.apiKey" `
            --output tsv

          npx --yes @azure/static-web-apps-cli@2 deploy `
            $artifactPath `
            --env production `
            --deployment-token $deploymentToken
